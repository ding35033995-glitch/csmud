<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者｜找到你落腳行星</title><style>body{margin:0;background:#08111f;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}main{width:min(1000px,calc(100% - 32px));margin:0 auto;padding:32px 16px}.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.04)}.bar{height:8px;background:#182235;border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#aebeff}.btn,input{padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.14);font-size:15px}.btn{cursor:pointer;background:#d9dcff;color:#12172a;font-weight:700}.ghost{background:transparent;color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}input{background:#0f1829;color:#fff;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid rgba(255,255,255,.12)}.muted{color:#aab4c5;line-height:1.7}@media(max-width:620px){main{width:min(100% - 20px,1000px);padding:20px 10px}.panel{padding:18px}.grid{grid-template-columns:1fr}table{font-size:12px}.btn,input{min-height:50px}.row .btn{width:100%}}
</style></head><body><main><section class="panel" id="login"><h1>管理者後台</h1><p class="muted">此頁不會出現在受測者首頁。</p><input id="pw" type="password" placeholder="管理者密碼" autocomplete="current-password"><div class="row"><button class="btn" onclick="enter()">登入</button></div></section><section class="panel" id="dash" style="display:none"></section></main><script>const planets=['水星','金星','地球','火星','木星','土星','天王星','海王星'];let adminPassword='';async function enter(){adminPassword=document.getElementById('pw').value;if(!adminPassword)return;await render()}async function render(){const r=await fetch('/api/admin',{headers:{'x-admin-password':adminPassword}});const d=await r.json();if(!r.ok){alert(d.error||'登入失敗');return}document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';const counts=Array(8).fill(0);d.counts.forEach(x=>counts[x.group_index]=x.count);document.getElementById('dash').innerHTML='<h1>分組狀態</h1><div class="grid">'+planets.map((p,i)=>`<div class="card"><b>${p}組</b><div class="muted">${counts[i]} 人</div><div class="bar"><i style="width:${counts[i]*(100/11)}%"></i></div></div>`).join('')+'</div><div class="row"><button class="btn" onclick="downloadCSV()">匯出 CSV</button></div><div style="overflow:auto"><table><thead><tr><th>編號</th><th>時間</th><th>年級/本名</th><th>行星</th><th>分組</th></tr></thead><tbody>'+d.users.map(u=>`<tr><td>${u.public_id}</td><td>${new Date(u.created_at).toLocaleString('zh-TW')}</td><td>${esc(u.name)}</td><td>${planets[u.group_index]}</td><td>${planets[u.group_index]}組</td></tr>`).join('')+'</tbody></table></div>'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function downloadCSV(){const r=await fetch('/api/admin',{headers:{'x-admin-password':adminPassword}});const d=await r.json();let csv='編號,時間,年級/本名,行星,分組\n'+d.users.map(u=>[u.public_id,new Date(u.created_at).toLocaleString('zh-TW'),u.name,planets[u.group_index],planets[u.group_index]+'組'].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='planet-groups.csv';a.click()}</script></body></html>
